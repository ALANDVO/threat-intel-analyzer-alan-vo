services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - APP_NAME=Threat Intel Analyzer
      - ENVIRONMENT=production
      - DEMO_MODE=false
      - DATABASE_URL=sqlite:////app/data/threat_intel.db
      - SESSION_SECRET_KEY=dev-session-key-must-be-rotated-for-production-min32b
      - OIDC_ISSUER=http://keycloak:8080/realms/threat-intel
      - OIDC_CLIENT_ID=threat-intel-analyzer
      - OIDC_CLIENT_SECRET=threat-intel-keycloak-client-secret-placeholder
      - LLM_PROVIDER=openai-compatible
      - LLM_BASE_URL=https://llm.chris-vo.com/v1
      - LLM_MODEL=qwen3.8-27b
      - LLM_API_KEY=
    volumes:
      - sqlite-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sqlite-data:
  keycloak-data:
